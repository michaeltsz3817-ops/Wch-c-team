rflow:hidden;background:radial-gradient(circle at 70% 25%,#b12b3155,transparent 25%),linear-gradient(155deg,#262b30,#13171b 50%,#52151b)}.scenein:before{content:"FIRE\A STATION";white-space:pre;position:absolute;left:22px;top:20px;font-size:60px;line-height:.8;font-weight:900;color:#fff06}.truck{position:absolute;width:65%;height:28%;left:28%;top:25%;border:3px solid #b82b31aa;border-radius:8px;background:linear-gradient(#8c1b22,#3c0e13);box-shadow:0 30px 50px #0008}.truck:after{content:"FIRE";position:absolute;left:16px;bottom:12px;font-size:20px;font-weight:900}.jacket{position:absolute;width:43%;height:58%;left:10%;bottom:5%;background:linear-gradient(120deg,#4a3e2b,#a2875c,#332a20);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);opacity:.9}.jacket:after{content:"C TEAM";position:absolute;right:10px;top:38px;font-weight:900;font-size:11px;color:#17120d}.helmet{position:absolute;width:37%;height:17%;right:9%;bottom:16%;border:2px solid #d7b873aa;border-radius:50% 50% 25% 25%;background:#a78b54;transform:rotate(-8deg)}.wrap{max-width:1400px;margin:auto;padding:45px 28px}.cats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--l);border-bottom:1px solid var(--l)}.cat{padding:20px 18px;background:transparent;color:#aab0b7;border:0;border-right:1px solid var(--l);cursor:pointer;text-align:left}.cat:last-child{border:0}.cat b{display:block;color:#fff;font-size:15px}.cat small{display:block;font-size:9px;letter-spacing:.2em;margin-top:5px}.cat.active{background:linear-gradient(135deg,#971c24,#4b1015);color:#fff}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px}.k{color:var(--g);font-size:10px;letter-spacing:.3em;text-transform:uppercase}.head h2{font-size:36px;margin:8px 0 0;letter-spacing:.03em}.note{font-size:10px;color:#818891;letter-spacing:.2em}.schedule{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--l);background:linear-gradient(120deg,#0d1014,#181c21)}.sb{padding:25px;border-right:1px solid var(--l)}.sb:last-child{border:0}.sb .t{color:var(--g);font-size:9px;letter-spacing:.2em}.sb .big{font-size:23px;font-weight:900;margin-top:8px}.sb p{font-size:11px;line-height:1.7;color:#858c94;margin-bottom:0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{background:linear-gradient(#15191e,#0c0f12);border:1px solid var(--l);overflow:hidden}.pic{height:220px;background:linear-gradient(145deg,#2a2f35,#0c0f12 62%,#3a1117);position:relative;display:grid;place-items:center}.pic:before{content:"";position:absolute;inset:12px;border:1px solid #fff0d}.art{font-size:65px;font-weight:900;color:#d9d5cd}.pic small{display:block;color:var(--g);font-size:9px;letter-spacing:.22em;text-align:center}.body{padding:17px}.code{font-size:9px;color:var(--g);letter-spacing:.18em}.body h3{font-size:17px;margin:7px 0 3px}.body p{font-size:9px;color:#7f8790;letter-spacing:.15em}.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.size{background:#0c0f12;color:#adb3ba;border:1px solid var(--l);padding:7px 2px;font-size:9px;cursor:pointer}.size.sel{background:var(--g);color:#17130c;border-color:var(--g)}.add{width:100%;margin-top:10px;background:transparent;color:#fff;border:1px solid #d7b87366;padding:10px;cursor:pointer;font-size:9px;letter-spacing:.13em}.add:hover{background:var(--r)}.custom{margin-top:30px;padding:24px;border:1px solid #d7b87340;background:linear-gradient(135deg,#101318,#211418)}.custom h3{margin:0;font-size:20px}.custom p{font-size:10px;color:#858c94}.crow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px}.crow input{background:#090c10;border:1px solid var(--l);padding:12px;color:#fff;outline:0}.crow input:focus{border-color:var(--g)}.cartbar{position:sticky;bottom:0;z-index:80;background:#07090bdc;backdrop-filter:blur(18px);border-top:1px solid var(--l)}.cartin{max-width:1400px;margin:auto;padding:12px 28px;display:flex;justify-content:space-between;align-items:center}.cartin span{font-size:10px;color:#858c94;letter-spacing:.14em}.cartin strong{font-size:17px;color:#fff;margin-left:10px}.go{background:var(--g);border:0;padding:13px 20px;font-weight:900;cursor:pointer}.foot{border-top:1px solid var(--l);padding:55px 28px;background:#050608}.footin{max-width:1400px;margin:auto;display:flex;justify-content:space-between}.ft{color:var(--g);font-size:11px;letter-spacing:.25em}.fb{font-size:40px;font-weight:900;margin-top:8px}.motto{text-align:right;color:#777f87;font-size:9px;line-height:2.2;letter-spacing:.25em}@media(max-width:900px){.nav{display:none}.heroIn{grid-template-columns:1fr}.scene{display:none}.cats,.grid{grid-template-columns:repeat(2,1fr)}.schedule{grid-template-columns:1fr}.sb{border-right:0;border-bottom:1px solid var(--l)}.sb:last-child{border-bottom:0}.wrap{padding:35px 18px}.topin{padding:13px 18px}.heroIn{padding:55px 18px}.crow{grid-template-columns:1fr}.footin{flex-direction:column;gap:25px}.motto{text-align:left}.cartin{padding:10px 18px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.cats{grid-template-columns:1fr 1fr}.hero{min-height:620px}.crest{width:165px;height:165px}.cc{font-size:92px}.hero h1{font-size:49px}.brand .cn{font-size:13px}}
</style></head><body><div id="intro"><div class="intro"><div class="ring"><div class="bigc">C</div></div><div class="ey">WANCHAI FIRE STATION</div><div class="it">C TEAM · UNIFORM COLLECTION</div><div class="iline"></div></div></div><div id="root"></div><script type="text/babel">const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLSemKuLmfrqvXLTqQT2bK7mScp04kQ5AOfLUDKnZsNyLUDrRhFA/formResponse',F={NAME:'entry.1386941444',ITEM:'entry.1748307909',SIZE:'entry.584139612'};const P=[['208','跑步鞋','FOOTWEAR',['6','7','8','9']],['207','白色帆布鞋','FOOTWEAR',['6','7','8','9']],['216','黑色膠鞋 O/R','FOOTWEAR',['5','6','7','8']],['32','安全工作鞋','FOOTWEAR',['6','7','8','9']],['7','Firetred','FOOTWEAR',['6','7','8','9']],['256','Working T-shirt','TOPS',['S','M','L','XL']],['215','長袖藍恤','TOPS',['S','M','L','XL']],['220','短袖藍恤','TOPS',['S','M','L','XL']],['258','藍色長褲','BOTTOMS',['S','M','L','XL']],['247','藍色 P.T. 短褲','BOTTOMS',['S','M','L','XL']],['275','藍色 P.T. 背心','SPORTSWEAR',['S','M','L','XL']],['245','冬季 P.T. 上衣','SPORTSWEAR',['S','M','L','XL']],['28','Personal Equipment Bag','ACCESSORIES',['STD']],['10','Green Tool Bag','ACCESSORIES',['STD']],['88','布章','ACCESSORIES',['STD']],['180','防水布章','ACCESSORIES',['STD']],['30','Cap','ACCESSORIES',['S','M','L','XL']],['57','防火手套','ACCESSORIES',['S','M','L','XL']],['glove_mt','Mountain Gloves','ACCESSORIES',['S','M','L','XL']]];const C=[['FOOTWEAR','鞋類'],['TOPS','上身'],['BOTTOMS','下身'],['SPORTSWEAR','運動服'],['ACCESSORIES','配件']];let cat='FOOTWEAR',cart=JSON.parse(localStorage.getItem('c_team_cart')||'[]'),sel={};const A={FOOTWEAR:'◢',TOPS:'▱',BOTTOMS:'▯',SPORTSWEAR:'◇',ACCESSORIES:'▰'};function App(){let list=P.filter(x=>x[2]===cat);return <div><header className="top"><div className="topin"><div className="brand"><div className="mark">C</div><div><div className="cn">灣仔消防局 C隊</div><div className="en">WANCHAI FIRE STATION · C TEAM</div></div></div><nav className="nav"><a href="#home">HOME</a><a href="#collection">UNIFORM</a><a href="#schedule">INFORMATION</a><a href="#cart" onClick={openCart}>MY CART</a></nav><div className="cart">CART {cart.length}</div></div></header><section id="home" className="hero"><div className="heroIn"><div><div className="crest"><div className="cc">C</div></div><div className="meta">灣仔消防局 C隊 / WANCHAI FIRE STATION</div><h1>UNIFORM<span>COLLECTION</span></h1><div className="sub">2025 — 2026 · ONE TEAM. ONE STANDARD.</div><p className="desc">為 C 隊準備嘅制服及裝備選購平台，以消防現場嘅紀律、團隊感同專業標準，重新整理成一套更清晰、更有品牌感嘅內部訂購體驗。</p><div className="actions"><button className="btn primary" onClick={()=>document.getElementById('collection').scrollIntoView()}>EXPLORE COLLECTION →</button><button className="btn" onClick={()=>document.getElementById('schedule').scrollIntoView()}>VIEW SCHEDULE</button></div></div><div className="scene"><div className="scenein"><div className="truck"></div><div className="jacket"></div><div className="helmet"></div></div></div></div></section><main><div className="wrap"><div className="cats">{C.map(x=><button className={'cat '+(cat===x[0]?'active':'')} onClick={()=>{cat=x[0];render()}}><b>{x[1]}</b><small>{x[0]}</small></button>)}</div></div><section id="schedule" className="wrap"><div className="head"><div><div className="k">Uniform Schedule</div><h2>制服更換安排</h2></div><div className="note">DISCIPLINE · UNITY · DUTY</div></div><div className="schedule"><div className="sb"><div className="t">CURRENT WINDOW</div><div className="big">9月 · 單數月</div><p>現正可上網報制服；截止日期請留意隊內通知。</p></div><div className="sb"><div className="t">NEXT CHANGE</div><div className="big">10月 · 雙數月</div><p>下一次預計更換：收舊制服及派新制服。</p></div><div className="sb"><div className="t">TEAM STANDARD</div><div className="big">ONE TEAM</div><p>尺寸如有特別要求，可於自訂項目填寫備註。</p></div></div></section><section id="collection" className="wrap"><div className="head"><div><div className="k">01 · The Collection</div><h2>制服系列</h2></div><div className="note">EQUIPMENT FOR A HIGHER STANDARD</div></div><div className="grid">{list.map(p=><article className="card"><div className="pic"><div className="art">{A[p[2]]}<small>{p[1]}</small></div></div><div className="body"><div className="code">ITEM {p[0]}</div><h3>{p[1]}</h3><p>{p[2]}</p><div className="sizes">{p[3].map(s=><button className={'size '+((sel[p[0]]||p[3][0])===s?'sel':'')} onClick={()=>{sel[p[0]]=s;render()}}>{s}</button>)}</div><button className="add" onClick={()=>{cart.push({item:p[1],code:p[0],size:sel[p[0]]||p[3][0]});localStorage.setItem('c_team_cart',JSON.stringify(cart));render()}}>ADD TO COLLECTION</button></div></article>)}</div><div className="custom"><h3>自訂項目 / 特別尺寸</h3><p>標準尺碼以外，或者有特別需求，可直接加入清單備註。</p><div className="crow"><input id="cn" placeholder="項目名稱，例如：特別版章、改短褲長等"/><input id="cs" placeholder="尺寸 / 備註"/><button className="btn primary" onClick={()=>{let n=document.getElementById('cn').value.trim(),s=document.getElementById('cs').value.trim();if(n){cart.push({item:n,code:'CUSTOM',size:s||'備註'});localStorage.setItem('c_team_cart',JSON.stringify(cart));render()}}}>ADD</button></div></div></section></main><div id="cart" className="cartbar"><div className="cartin"><span>CURRENT COLLECTION <strong>{cart.length}</strong> ITEMS</span><button className="go" onClick={openCart}>REVIEW & SUBMIT →</button></div></div><footer className="foot"><div className="footin"><div><div className="ft">WANCHAI FIRE STATION</div><div className="fb">C TEAM</div><div style={{marginTop:12,color:'#777f87',fontSize:11}}>守護社區 · 從不止步</div></div><div className="motto">DISCIPLINE<br/>UNITY<br/>DUTY<br/><br/>MORE THAN A TEAM.<br/>A COMMITMENT.</div></div></footer></div>}function openCart(){let old=document.getElementById('cartModal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="cartModal"><div class="mc"><h3>Review & Submit</h3><div style="font-size:10px;color:#8b9299;margin-top:4px">確認後會逐項提交到原有 Google Form。</div><div class="ml">${cart.length?cart.map((x,i)=>`<div class="mr"><span>${i+1}. ${x.item}</span><span>${x.size}</span></div>`).join(''):'<div class="mr"><span>暫時未有項目</span><span>—</span></div>'}</div><input id="nm" value="${(localStorage.getItem('c_team_user_name')||'').replace(/"/g,'&quot;')}" placeholder="姓名"><div class="ma"><button class="btn" onclick="document.getElementById('cartModal').remove()">CLOSE</button><button class="btn primary" onclick="submitCart()">SUBMIT ORDER</button></div></div></div>`)}async function submitCart(){let n=document.getElementById('nm').value.trim();if(!n){alert('請輸入姓名');return}if(!cart.length){alert('暫時未有項目');return}localStorage.setItem('c_team_user_name',n);let ok=0;for(const x of cart){try{let f=new FormData();f.append(F.NAME,n);f.append(F.ITEM,x.item);f.append(F.SIZE,x.size);await fetch(FORM_URL,{method:'POST',mode:'no-cors',body:f});ok++}catch(e){}}cart=[];localStorage.removeItem('c_team_cart');document.getElementById('cartModal').remove();render();alert('已提交 '+ok+' 項。')}function render(){ReactDOM.createRoot(document.getElementById('root')).render(<App/>)}render();if(sessionStorage.getItem('c_team_intro_seen'))document.getElementById('intro').remove();else{sessionStorage.setItem('c_team_intro_seen','1');setTimeout(()=>{let x=document.getElementById('intro');x.style.opacity=0;setTimeout(()=>x.remove(),560)},1500)}</script></body></html>
